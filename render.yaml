services:
  - type: web
    name: doaj-pre-assessment
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.freemodel.dev/v1
      - key: AI_MODEL
        value: gpt-5.4-mini
    healthCheckPath: /health
